<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cyber Admin | Secure Gateway</title>

  <!-- Google Font -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Main CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>


  <!-- =====================================================
       BACKGROUND VIDEO
  ====================================================== -->

  <div class="video-container">

    <video
      autoplay
      muted
      loop
      playsinline
      id="bgVideo"
      poster="bg.mp4"
    >

      <source
        src="bg.mp4"
        type="video/mp4"
      >

      Your browser does not support the video tag.

    </video>


    <div class="video-overlay"></div>

  </div>



  <!-- =====================================================
       LOGIN WRAPPER
  ====================================================== -->

  <main
    class="login-wrapper"
    role="main"
  >


    <!-- ===================================================
         LOGIN BOX
    ==================================================== -->

    <div class="login-box cyber-panel">


      <!-- =================================================
           HEADER
      ================================================== -->

      <div class="login-header">


        <!-- Logo -->

        <div class="logo-wrapper">

          <img
            src="logo.png"
            alt="Cyber Admin Logo"
            class="logo"
            onerror="this.style.display='none'"
          >

        </div>


        <!-- Title -->

        <h2>
          Restricted Access
        </h2>


        <!-- Subtitle -->

        <p class="subtitle">
          Authenticate with authorized credentials to proceed.
        </p>

      </div>



      <!-- =================================================
           GOOGLE LOGIN
      ================================================== -->

      <div class="google-login-section">


        <button
          type="button"
          id="googleLoginBtn"
          class="cyber-google-btn"
          aria-label="Authenticate via Google"
        >


          <!-- Google Icon -->

          <svg
            class="google-icon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            aria-hidden="true"
          >

            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />

            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />

            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
            />

            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
            />

          </svg>


          <!-- Button Text -->

          <span class="btn-text">
            Authenticate via Google
          </span>


        </button>

      </div>



      <!-- =================================================
           STATUS / ERROR MESSAGE
      ================================================== -->

      <div
        id="error-msg"
        class="feedback-message"
        aria-live="polite"
        role="alert"
        hidden
      ></div>


    </div>


  </main>



  <!-- =====================================================
       FIREBASE / LOGIN LOGIC
       
       IMPORTANT:
       login.js er moddhei Firebase import,
       Google login, allowlist, redirect sob thakbe.
  ====================================================== -->

<script type="module" src="login.js"></script>

</body>

</html>
