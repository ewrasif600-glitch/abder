<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Collection | Modern Dashboard</title>

  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="apple-touch-icon" href="../logo.png">

  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>

    /* =========================================
        ASF COLLECTION - MODERN RESPONSIVE THEME
    ========================================= */

    :root {
      --bg: #030712;
      --bg-secondary: #0b0f19;
      --panel: #111827;
      --panel-hover: #1f2937;

      --border: rgba(255, 255, 255, 0.07);
      --border-light: rgba(255, 255, 255, 0.12);

      --text: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;

      --primary: #8b5cf6;
      --primary-light: #a78bfa;
      --primary-glow: rgba(139, 92, 246, 0.25);

      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.1);

      --sidebar-width: 260px;
      --radius-sm: 10px;
      --radius-md: 16px;
    }


    /* =========================================
        RESET & BASE
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.08), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.06), transparent 40%);
      color: var(--text);
      font-family: "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a {
      font-family: inherit;
    }

    button {
      border: 0;
      background: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================
        LAYOUT & RESPONSIVE CONTAINER
    ========================================= */

    .dashboard-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      position: relative;
    }


    /* =========================================
        SIDEBAR (RESPONSIVE)
    ========================================= */

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      padding: 28px 20px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      z-index: 1000;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 10px;
      margin-bottom: 40px;
    }

    .logo img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(59,130,246,0.1));
      border: 1px solid rgba(139,92,246,0.3);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .logo h2 {
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.2px;
      background: linear-gradient(135deg, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar nav ul {
      list-style: none;
    }

    .sidebar nav li {
      margin-bottom: 8px;
    }

    .sidebar nav a {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      gap: 14px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .sidebar nav a i {
      width: 20px;
      text-align: center;
      font-size: 15px;
    }

    .sidebar nav a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border);
      transform: translateX(4px);
    }

    .sidebar nav a.active {
      color: #ffffff;
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.18), rgba(139, 92, 246, 0.04));
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow: inset 3px 0 0 var(--primary), 0 4px 20px rgba(139, 92, 246, 0.15);
    }

    .sidebar nav a.active i {
      color: var(--primary-light);
    }


    /* =========================================
        MAIN CONTENT (RESPONSIVE)
    ========================================= */

    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 35px;
      width: calc(100% - var(--sidebar-width));
      transition: all 0.3s ease;
    }

    .main-content h1 {
      margin-bottom: 24px;
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }


    /* =========================================
        NOTIFICATION BAR
    ========================================= */

    #notifications {
      width: 100%;
      min-height: 50px;
      margin-bottom: 24px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    #notifications p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
    }


    /* =========================================
        TABLE CONTAINER & STYLING
    ========================================= */

    .table-responsive {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #collectionTable {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 650px;
    }

    #collectionTable thead {
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
    }

    #collectionTable th {
      padding: 18px 22px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    #collectionTable td {
      padding: 18px 22px;
      color: var(--text);
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    #collectionTable tbody tr {
      transition: background 0.2s ease;
    }

    #collectionTable tbody tr:hover {
      background: rgba(139, 92, 246, 0.04);
    }

    #collectionTable tbody tr:last-child td {
      border-bottom: none;
    }


    /* =========================================
        SPECIFIC CELL FONTS & STYLING
    ========================================= */

    /* Email Column */
    #collectionTable td:first-child {
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
    }

    /* Password Column - Bold & Styled Font */
    #collectionTable td.password-cell {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 13.5px;
      color: #fbbf24;
      letter-spacing: 1.5px;
      background: rgba(251, 191, 36, 0.05);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(251, 191, 36, 0.15);
      display: inline-block;
      margin: 4px 0;
    }

    /* Time Column */
    #collectionTable td:nth-child(3) {
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
    }


    /* =========================================
        ACTION BUTTON (DELETE)
    ========================================= */

    #collectionTable button {
      height: 36px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fb7185;
      background: var(--danger-bg);
      border: 1px solid rgba(244, 63, 94, 0.2);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #collectionTable button:hover {
      color: #ffe4e6;
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
    }


    /* =========================================
        MODALS & POPUPS
    ========================================= */

    .popup-alert {
      position: fixed;
      top: 24px;
      right: 24px;
      min-width: 300px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(16px);
      color: #ffffff;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-left: 4px solid #10b981;
      border-radius: var(--radius-sm);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      z-index: 9999;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.3s ease 3.5s forwards;
    }

    .popup-alert i {
      color: #34d399;
      font-size: 18px;
    }

    .popup-alert b {
      color: var(--primary-light);
      font-weight: 700;
    }

    .delete-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 360px;
      padding: 32px;
      background: rgba(17, 24, 39, 0.98);
      backdrop-filter: blur(20px);
      color: var(--text);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-align: center;
      animation: scaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .delete-popup span {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
    }

    .delete-popup div {
      width: 100%;
      display: flex;
      gap: 12px;
    }

    .delete-popup button {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .delete-popup .confirm-btn {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .delete-popup .confirm-btn:hover {
      background: rgba(244, 63, 94, 0.25);
      border-color: rgba(244, 63, 94, 0.5);
    }

    .delete-popup .cancel-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .delete-popup .cancel-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }


    /* =========================================
        ANIMATIONS
    ========================================= */

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(40px); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }


    /* =========================================
        SCROLLBAR
    ========================================= */

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }


    /* =========================================
        RESPONSIVE BREAKPOINTS
    ========================================= */

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 25px 15px;
      }
    }

  </style>

</head>


<body>

<script type="module">
  import { logout } from "../firebase/auth.js";
  window.logout = logout;
</script>

<div class="dashboard-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <img src="../logo.png" alt="Logo">
      <h2>ASF</h2>
    </div>

    <nav>
      <ul>
        <li>
          <a href="/dashboard/">
            <i class="fas fa-home"></i>
            Dashboard
          </a>
        </li>
        <li>
          <a href="/dashboard/collection/" class="active">
            <i class="fas fa-layer-group"></i>
            Collection
          </a>
        </li>
        <li>
          <a href="/dashboard/link/">
            <i class="fas fa-link"></i>
            Link
          </a>
        </li>
        <li>
          <a href="/dashboard/user-management/">
            <i class="fas fa-users"></i>
            User Management
          </a>
        </li>
        <li>
          <a href="/login/" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <h1>Collection</h1>

    <div id="notifications"></div>

    <div class="table-responsive">
      <table id="collectionTable">
        <thead>
          <tr>
            <th>Email</th>
            <th>Password</th>
            <th>Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

</div>

<audio id="notifySound" src="notify.mp3" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getDatabase, ref, onValue, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgJA67XUBtysxdEl_6tKl0Tebpr2zkbuw",
  authDomain: "abder-b11b9.firebaseapp.com",
  projectId: "abder-b11b9",
  storageBucket: "abder-b11b9.firebasestorage.app",
  messagingSenderId: "163440280492",
  appId: "1:163440280492:web:203a19b2dc0b79ab313009",
  measurementId: "G-SG3T0841FJ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tableBody = document.querySelector("#collectionTable tbody");
const notifications = document.getElementById("notifications");
const notifySound = document.getElementById("notifySound");

const requestsRef = ref(db, 'joinRequests');
let isInitialLoad = true;

// Helper: Convert stored timestamp to readable format
function formatTimestamp(ts) {
  if (!ts) return "N/A";
  const numTs = typeof ts === "string" ? Number(ts) : ts;
  if (isNaN(numTs)) return ts; // fallback
  return new Date(numTs).toLocaleString("en-GB", { timeZone:"Asia/Dhaka" });
}

// Full list update
onValue(requestsRef, (snapshot) => {
  const data = snapshot.val();
  tableBody.innerHTML = '';

  if (!data) {
    notifications.innerHTML = `<p>No requests found</p>`;
    isInitialLoad = false;
    return;
  }

  const keys = Object.keys(data);
  notifications.innerHTML = `<p>${keys.length} requests found</p>`;

  keys.forEach(key => {
    const request = data[key];
    const formattedTime = formatTimestamp(request.timestamp);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${request.email || ''}</td>
      <td><span class="password-cell">${request.password || ''}</span></td>
      <td>${formattedTime}</td>
      <td></td>
    `;

    const deleteBtn = document.createElement("button");
    deleteBtn.innerHTML = `<i class="fas fa-trash-alt"></i> Delete`;
    deleteBtn.onclick = () => window.deleteRequest(key);
    tr.querySelector("td:last-child").appendChild(deleteBtn);

    tableBody.appendChild(tr);
  });

  setTimeout(()=> { isInitialLoad = false; }, 100);
});

// New user added → only notify sound
onChildAdded(requestsRef, (snapshot) => {
  if (isInitialLoad) return;
  const request = snapshot.val();
  if(!request) return;

  try { notifySound.play(); } catch(e){ console.warn("Autoplay blocked."); }

  if(Notification.permission === "granted"){
    new Notification("New request received!", {
      body: `Email: ${request.email || "Unknown user"}`,
      icon: "../logo.png"
    });
  }

  const popup = document.createElement("div");
  popup.className = "popup-alert";
  popup.innerHTML = `<i class="fas fa-bell"></i> New request from <b>${request.email || "Unknown"}</b>`;
  document.body.appendChild(popup);
  setTimeout(()=>popup.remove(),4000);
});

// Delete request with modern popup
window.deleteRequest = function(key){
  const popup = document.createElement("div");
  popup.className = "delete-popup";
  popup.innerHTML = `
    <span>Are you sure you want to delete this request?</span>
    <div>
      <button class="confirm-btn">Yes</button>
      <button class="cancel-btn">No</button>
    </div>
  `;
  document.body.appendChild(popup);

  popup.querySelector(".confirm-btn").onclick = () => {
    remove(ref(db, `joinRequests/${key}`))
      .then(() => {
        popup.remove();
        const donePopup = document.createElement("div");
        donePopup.className = "popup-alert";
        donePopup.innerHTML = `<i class="fas fa-check-circle"></i> Request deleted successfully`;
        document.body.appendChild(donePopup);
        setTimeout(()=>donePopup.remove(),3000);
      })
      .catch(err => alert("Error: "+err.message));
  };

  popup.querySelector(".cancel-btn").onclick = () => popup.remove();
  setTimeout(() => { if(document.body.contains(popup)) popup.remove(); }, 10000);
};
</script>

</body>
</html>
